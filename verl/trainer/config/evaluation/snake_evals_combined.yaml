# @package eval
# Combined standard and multi-action evaluation configs for FastSnake
# Use with: evaluation=snake_evals_combined

evaluation:
  environments:
    # =============================================================================
    # STANDARD EVALUATION CONFIGS (single-action reasoning)
    # =============================================================================

    - name: "Snake-20Step-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 10000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        # type: inherits from training config (e.g., naive or multi_action)
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1
        step_reward: 0


    - name: "Snake-20Steps-PoisonAppleAndBanana-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 20000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - All apples are poisonous and will hurt you. If you move onto an apple, you *lose* 1 point.
        - All bananas are healthy and are good for you. If you move onto a banana, you *receive* 1 point and you gain a body segment.
        - You die if you move into a wall, another snake, or yourself
      captioner:
        # type: inherits from training config (e.g., naive or multi_action)
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 3
        num_bananas: 3
        apple_reward: -1
        banana_reward: 1
        width: 10
        height: 10
        print_coordinates: true
        max_rounds: 20
        death_reward: -1
        step_reward: 0
        print_visualization: false


    - name: "FastSnake-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 30000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        # type: inherits from training config (e.g., naive or multi_action)
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    - name: "FastSnake-Default-StateVisitation"
      n_rollouts: 400
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: True
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        # type: inherits from training config (e.g., naive or multi_action)
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 0
        death_reward: -1
        step_reward: 0
        no_respawn: true
        print_visualization: false


    # =============================================================================
    # MULTI-ACTION EVALUATION CONFIGS (multi-action reasoning)
    # =============================================================================

    - name: "MA-Snake-20Step-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 10000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        You must reason about EACH available action, then make a decision.

        First, analyze each action by generating an <action> tag for each:
        <actions>
        <action name="up">Your reasoning about why moving up might be good or bad...</action>
        <action name="down">Your reasoning about why moving down might be good or bad...</action>
        <action name="left">Your reasoning about why moving left might be good or bad...</action>
        <action name="right">Your reasoning about why moving right might be good or bad...</action>
        </actions>

        Then, output your final decision:
        <decision>your_chosen_action</decision>

        [Rules]
        - Eat apples to grow and score points
        - Avoid walls, your own body, and enemy snakes
        - You must output reasoning for ALL four actions before making your decision
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1
        step_reward: 0


    - name: "MA-Snake-20Steps-PoisonAppleAndBanana-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 20000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        You must reason about EACH available action, then make a decision.

        First, analyze each action by generating an <action> tag for each:
        <actions>
        <action name="up">Your reasoning about why moving up might be good or bad...</action>
        <action name="down">Your reasoning about why moving down might be good or bad...</action>
        <action name="left">Your reasoning about why moving left might be good or bad...</action>
        <action name="right">Your reasoning about why moving right might be good or bad...</action>
        </actions>

        Then, output your final decision:
        <decision>your_chosen_action</decision>

        [Rules]
        - All apples are poisonous and will hurt you. If you move onto an apple, you *lose* 1 point.
        - All bananas are healthy and are good for you. If you move onto a banana, you *receive* 1 point and you gain a body segment.
        - Avoid walls, your own body, and enemy snakes
        - You must output reasoning for ALL four actions before making your decision
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 3
        num_bananas: 3
        apple_reward: -1
        banana_reward: 1
        width: 10
        height: 10
        print_coordinates: true
        max_rounds: 20
        death_reward: -1
        step_reward: 0
        print_visualization: false
