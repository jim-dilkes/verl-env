# @package eval
# Minimal split eval for ICE internalization — login node smoke test (FastSnake)
# 4 diagnostic blocks (base + ctx) with tiny rollout counts
# Use with: evaluation=snake_evals_ice_split_minimal

evaluation:
  environments:
    # --- Base Entropy (no ICE focus — internalization) ---
    - name: "FastSnake-Entropy-Check"
      n_rollouts: 4
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 30000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: false
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
      action_entropy:
        enabled: true
        n_samples: 4
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32

    # --- Base State Visitation (no ICE focus — internalization) ---
    - name: "FastSnake-Default-StateVisitation"
      n_rollouts: 10
      batch_size: 5
      episode_length: 3
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: True
      initial_seed: 40000
      seed_group_size: 5
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: false
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 3
        num_external_snakes: 1
        num_random_snakes: 0
        death_reward: -1
        step_reward: 0
        no_respawn: true
        print_visualization: false

    # --- Context-Augmented Entropy (with ICE focus — ceiling) ---
    - name: "FastSnake-Entropy-Check-Ctx"
      n_rollouts: 4
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 30000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: false
      inherit_training_multiaction: true
      inherit_ice: true
      ice_proportion: 0.8
      instruction_prompt: |
