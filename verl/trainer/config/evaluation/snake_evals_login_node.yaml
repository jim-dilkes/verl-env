# @package eval

# Small evaluation config intended for login-node smoke tests.
# Keeps GPU memory usage low by using a single env and small n_rollouts.

evaluation:
  environments:
    - name: "FastSnake-LoginNode-Smoke"
      n_rollouts: 4
      episode_length: 2
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 0
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      captioner:
        # type: inherits from training config (e.g., naive or multi_action)
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 2
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
