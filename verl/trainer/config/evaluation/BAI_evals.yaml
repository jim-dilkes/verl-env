# @package eval

evaluation:
  environments:
    # --- Config 3: BabyAI Evaluation ---
    - name: "BabyAI-GoToLocalS5N2"
      n_rollouts: 100
      episode_length: 20
      initial_seed: 0 # Use a fixed seed for reproducibility
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: babyai
      task: BabyAI-GoToLocalS5N2-v0
      format_penalty: 0.0
      binary_reward: False
      captioner:
        type: naive
        max_text_history: 0
      babyai_kwargs:
        max_steps: 20

