# @package eval
# Standard evaluation configs for Snake with scratch memory
# Use with: evaluation=snake_evals_scratch

evaluation:
  environments:
    # --- Config 1: Default Evaluation ---
    - name: "FastSnake-Default-Greedy"
      n_rollouts: 50
      episode_length: 8
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 0
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <scratch>...</scratch>, <plan>...</plan>, and <action>...</action> tags. Stop responding after the </action> tag.

        <scratch>
        <!-- Update previous <scratch> (keep relevant, remove stale, add new). Max 3 items, 5-10 words each. -->
        <subgoal>{5-10 words}</subgoal>
        <memo>{5-10 words}</memo>
        <memo>{5-10 words}</memo>
        </scratch>
        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
        max_cot_history: 1
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false


    - name: "Snake-20Step-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 10000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.
        
        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <scratch>...</scratch>, <plan>...</plan>, and <action>...</action> tags. Stop responding after the </action> tag.

        <scratch>
        <!-- Update previous <scratch> (keep relevant, remove stale, add new). Max 3 items, 5-10 words each. -->
        <subgoal>{5-10 words}</subgoal>
        <memo>{5-10 words}</memo>
        <memo>{5-10 words}</memo>
        </scratch>
        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
        max_cot_history: 1
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1


    - name: "Poison-Apple-OOD"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 20000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: poison_apple
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.
        
        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <scratch>...</scratch>, <plan>...</plan>, and <action>...</action> tags. Stop responding after the </action> tag.

        <scratch>
        <!-- Update previous <scratch> (keep relevant, remove stale, add new). Max 3 items, 5-10 words each. -->
        <subgoal>{5-10 words}</subgoal>
        <memo>{5-10 words}</memo>
        <memo>{5-10 words}</memo>
        </scratch>
        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto a normal apple, you get 1 point and you gain a body segment
        - If you move onto a POISON apple (marked 'P'), you die immediately
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
        max_cot_history: 1
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1


    # --- Entropy Check (inherits from training) ---
    - name: "FastSnake-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 30000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      captioner:
        type: naive
        max_text_history: 0
        max_cot_history: 1
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    # --- StateVisitation (inherits from training) ---
    - name: "FastSnake-StateVisitation"
      n_rollouts: 300
      batch_size: 50
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      captioner:
        type: naive
        max_text_history: 0
        max_cot_history: 1
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
