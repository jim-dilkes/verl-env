# @package eval

evaluation:
  environments:
    # --- Config 1: Default Evaluation ---
    - name: "FastSnake-Default-Greedy"
      n_rollouts: 50
      episode_length: 8
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 0 # Use a fixed seed for reproducibility
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false


    - name: "Snake-20Step-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 10000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game
        
        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1
        step_reward: 0


    # --- Config 9: Snake-20Steps-PoisonAppleAndBanana ---
    - name: "Snake-20Steps-PoisonAppleAndBanana-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 20000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - All apples are poisonous and will hurt you. If you move onto an apple, you *lose* 1 point.
        - All bananas are healthy and are good for you. If you move onto a banana, you *receive* 1 point and you gain a body segment.
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 3
        num_bananas: 3
        apple_reward: -1
        banana_reward: 1
        width: 10
        height: 10
        print_coordinates: true
        max_rounds: 20
        death_reward: -1
        step_reward: 0
        print_visualization: false

    # --- Config 10: FastSnake Entropy Probe ---
    - name: "FastSnake-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 30000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32



    - name: "FastSnake-Default-StateVisitation"
      n_rollouts: 400
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: | 
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are controlling a snake in a multi-player Snake game

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        type: naive
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 0
        death_reward: -1
        step_reward: 0
        no_respawn: true # No random elements to ensure deterministic environment behavior
        print_visualization: false