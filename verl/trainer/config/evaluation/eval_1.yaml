      binary_reward: False
      captioner:
        type: naive
        max_text_history: 0
      babyai_kwargs:
        max_steps: 20

    # --- Config 4: FrozenLake Evaluation ---
    - name: "FrozenLake-NoSlip"
      n_rollouts: 100
      episode_length: 8
      initial_seed: 1 # Use a fixed seed for reproducibility
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: frozenlake
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens).
        You are navigating the surface of a frozen lake. You must reach the goal. 

        [Available Actions]
        "left": move left,
        "down": move down,
        "right": move right,
        "up": move up,

        [Rules]
        - If you step on a hole, you will fall through and die
        - You can take one action out of up, down, left, or right
      captioner:
        type: naive
        max_text_history: 0
      frozenlake_kwargs:
        random_map_size: 4
        frozen_probability: 0.80
        is_slippery: false
        print_visualization: true
        print_coordinates: true
        max_rounds: 8

    # --- Config 4: FrozenLake-Default ---
    - name: "FrozenLake-Slippery"
      n_rollouts: 100
      episode_length: 15
      initial_seed: 2
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: frozenlake
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens).
        You are navigating the surface of a frozen lake. You must reach the goal. 

        [Available Actions]
        "left": move left,
        "down": move down,
        "right": move right,
        "up": move up,

        [Rules]
        - If you step on a hole, you will fall through and die. 
        - The ice is slippery, so you might accidentally move in an perpendicular direction with every step.
        - You can take one action out of up, down, left, or right
      captioner:
        type: naive
        max_text_history: 0
      frozenlake_kwargs:
        random_map_size: 4
        frozen_probability: 0.90
        is_slippery: true
        print_visualization: true
        print_coordinates: true
        max_rounds: 15


