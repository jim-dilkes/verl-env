      format_penalty: 0.0
      binary_reward: False
      captioner:
        type: naive
        max_text_history: 0
      babyai_kwargs:
        max_steps: 20


    # --- Config 3: BabyAI Evaluation ---
    - name: "BabyAI-GoToRedBall"
      n_rollouts: 100
