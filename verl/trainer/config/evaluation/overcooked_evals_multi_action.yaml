    # --- Config: Overcooked Entropy Probe (Multi-Action) ---
    # Uses inherit_training_multiaction to measure policy entropy with same exploration as training
    - name: "Overcooked-CrampedRoom-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 30000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      inherit_training_multiaction: true
