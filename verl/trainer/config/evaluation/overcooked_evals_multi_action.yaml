# @package eval
# Multi-action reasoning evaluation configs for Overcooked
# Use with: evaluation=overcooked_evals_multi_action
# Requires training with: prompt=overcooked_multi_action

evaluation:
  environments:
    - name: "Overcooked-CrampedRoom"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.6
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 0
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a chef cooking meals in a kitchen.
        Your goal is to cook and deliver the meals as fast as possible to earn rewards. Your maximum response length: 400 words.

        [Recipe]
        3 onions

        [How to Cook]
        1. Identify the ingredients needed for the meal from the recipe.
        2. Pick up ingredients from ingredient piles using 'interact' while facing them - you can hold only one ingredient at a time
        3. Place 3 ingredients in a pot using 'interact'
        4. Wait for the meal to cook
        5. Pick up a dish from the dish pile using 'interact'
        6. Pick up the cooked meal from the pot using 'interact' (with dish in hand)
        7. Deliver the meal to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="right">{Your reasoning about moving right}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="stay">{Your reasoning about staying}</action>
        <action name="interact">{Your reasoning about interacting}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true
        random_agent_positions: true


    - name: "Overcooked-AsymmetricAdvantages"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.6
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 10000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a chef cooking meals in a kitchen.
        Your goal is to cook and deliver the meals as fast as possible to earn rewards. Your maximum response length: 400 words.

