        <action name="left">{Your reasoning about moving left}</action>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="stay">{Your reasoning about staying}</action>
        <action name="interact">{Your reasoning about interacting}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true
        random_agent_positions: true
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    # --- Config: Overcooked StateVisitation (Multi-Action) ---
    # Uses inherit_training_multiaction to measure exploration with same epsilon as training
    - name: "Overcooked-CrampedRoom-StateVisitation"
      n_rollouts: 400
      batch_size: 50
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
