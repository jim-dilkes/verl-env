        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: false
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    # --- Config: Overcooked StateVisitation (Multi-Action) ---
    # Uses inherit_training_epsilon to measure exploration with same epsilon as training
    - name: "Overcooked-CrampedRoom-StateVisitation"
