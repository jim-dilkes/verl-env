# @package eval
# Minimal evaluation config for memory testing
# Uses small n_rollouts (4) for low memory footprint

evaluation:
  environments:
    - name: "FastSnake-Minimal-Greedy"
      n_rollouts: 4
      episode_length: 8
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 0
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 200 words.

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

        <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can move your head one space up, down, left, or right
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
