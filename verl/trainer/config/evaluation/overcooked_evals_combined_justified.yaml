        4. Pick up a dish from the dish pile using 'interact'
        5. Pick up the cooked soup from the pot using 'interact' (with dish in hand)
        6. Deliver the soup to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Response Format]
        Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

        <plan>{Think about what you need to do next to make and deliver soups. Consider your position, what you're facing towards, what you're holding, and pot status.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can only hold one object at a time
        - Each soup requires exactly 3 ingredients
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: asymm_advantages
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true


    # --- Entropy Check (inherits from training) ---
    - name: "Overcooked-CrampedRoom-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 30000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    # --- StateVisitation (inherits from training) ---
    - name: "Overcooked-CrampedRoom-StateVisitation"
      n_rollouts: 300
      batch_size: 50
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      inherit_training_multiaction: true
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 8
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true


    # =============================================================================
    # MULTI-ACTION EVALUATION CONFIGS (multi-action reasoning with justifications)
    # =============================================================================

    - name: "MA-Overcooked-CrampedRoom"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.6
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 0
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a chef cooking soup in a kitchen.
        Your goal is to cook and deliver the soups as fast as possible to earn rewards. Your maximum response length: 400 words.

        [How to Cook]
        1. Pick up ingredients (e.g., onions) from ingredient piles using 'interact' while facing them
        2. Place 3 ingredients in a pot using 'interact'
        3. Wait for the soup to cook
        4. Pick up a dish from the dish pile using 'interact'
        5. Pick up the cooked soup from the pot using 'interact' (with dish in hand)
        6. Deliver the soup to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Response Format]
        You must reason about EACH available action, then make a decision.
        Think about what you need to do next to make and deliver soups.
        Consider your position, what you're facing towards, what you're holding, and pot status.

        For each action, provide a justification for why that action could help achieve the objective:
        <actions>
        <action name="right">Justify why moving right could be beneficial for cooking and delivering soups...</action>
        <action name="down">Justify why moving down could be beneficial for cooking and delivering soups...</action>
        <action name="left">Justify why moving left could be beneficial for cooking and delivering soups...</action>
        <action name="up">Justify why moving up could be beneficial for cooking and delivering soups...</action>
        <action name="stay">Justify why staying could be beneficial for cooking and delivering soups...</action>
        <action name="interact">Justify why interacting could be beneficial for cooking and delivering soups...</action>
        </actions>

        Then, output your final decision:
        <decision>your_chosen_action</decision>

        [Rules]
        - You can only hold one object at a time
        - Each soup requires exactly 3 ingredients
        - You must output reasoning for ALL six actions before making your decision
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true


