# @package eval
# Combined standard and multi-action evaluation configs for Overcooked (justified reasoning)
# Use with: evaluation=overcooked_evals_combined_justified

evaluation:
  environments:
    # =============================================================================
    # STANDARD EVALUATION CONFIGS (single-action reasoning)
    # =============================================================================

    - name: "Overcooked-CrampedRoom"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.6
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 0
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a chef cooking soup in a kitchen.
        Your goal is to cook and deliver the soups as fast as possible to earn rewards. Your maximum response length: 200 words.

        [How to Cook]
        1. Pick up ingredients (e.g., onions) from ingredient piles using 'interact' while facing them
        2. Place 3 ingredients in a pot using 'interact'
        3. Wait for the soup to cook
        4. Pick up a dish from the dish pile using 'interact'
        5. Pick up the cooked soup from the pot using 'interact' (with dish in hand)
        6. Deliver the soup to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Response Format]
        Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

        <plan>{Think about what you need to do next to make and deliver soups. Consider your position, what you're facing towards, what you're holding, and pot status.}</plan>
        <action>{Your selected action from the list above}</action>

        [Rules]
        - You can only hold one object at a time
        - Each soup requires exactly 3 ingredients
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: true
        pot_cook_time: 5
        print_visualization: false
        print_coordinates: true


    - name: "Overcooked-AsymmetricAdvantages"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.6
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 10000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a chef cooking soup in a kitchen.
        Your goal is to cook and deliver the soups as fast as possible to earn rewards. Your maximum response length: 200 words.

