# @package eval

evaluation:
  environments:
    - name: "Overcooked-CrampedRoom-Greedy"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 0
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are playing Overcooked solo. You control the only chef in a kitchen.
        Your goal is to cook and deliver soups as fast as possible.

        [How to Cook]
        1. Pick up ingredients (e.g., onions) from ingredient piles using 'interact'
        2. Place 3 ingredients in a pot using 'interact' while facing it
        3. Wait for the soup to cook
        4. Pick up a dish from the dish pile
        5. Pick up the cooked soup from the pot (with dish in hand)
        6. Deliver the soup to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Rules]
        - You can only hold one object at a time
        - Each soup requires exactly 3 ingredients
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: cramped_room
        horizon: 40
        partner_policy: none
        shaped_reward: False
        pot_cook_time: 5
        print_visualization: true
        print_coordinates: true

    - name: "Overcooked-AsymmetricAdvantages-Greedy"
      n_rollouts: 50
      episode_length: 40
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: False
      initial_seed: 10000
      freeze_completed_episodes: True
      duplication_mode: none
      env_name: overcooked
      task: none
      format_penalty: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant. You always respond by wrapping your thoughts in the correct XML tags. Your maximum response length: 200 words (tokens)
        You are playing Overcooked solo. You control the only chef in a kitchen.
        Your goal is to cook and deliver soups as fast as possible.

        [How to Cook]
        1. Pick up ingredients (e.g., onions) from ingredient piles using 'interact'
        2. Place 3 ingredients in a pot using 'interact' while facing it
        3. Wait for the soup to cook
        4. Pick up a dish from the dish pile
        5. Pick up the cooked soup from the pot (with dish in hand)
        6. Deliver the soup to the serving counter using 'interact'

        [Available Actions]
        "right": move right,
        "down": move down,
        "left": move left,
        "up": move up,
        "stay": stay in place (wait),
        "interact": interact with object in front of you (pick up, place, or use)

        [Rules]
        - You can only hold one object at a time
        - Each soup requires exactly 3 ingredients
      captioner:
        type: naive
        max_text_history: 0
      overcooked_kwargs:
        layout_name: asymmetric_advantages
        horizon: 40
        partner_policy: none
        shaped_reward: False
        pot_cook_time: 5
        print_visualization: true
        print_coordinates: true
