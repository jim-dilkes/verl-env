# @package eval
# Multi-action reasoning evaluation configs for FastSnake
# Use with: evaluation=snake_evals_multi_action
# Requires training with: prompt=snake_multi_action

evaluation:
  environments:
    # --- Config 1: Default Evaluation (Multi-Action) ---
    - name: "FastSnake-Default-Greedy"
      n_rollouts: 50
      episode_length: 8
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 0
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="right">{Your reasoning about moving right}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false


    - name: "Snake-20Step-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 10000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="right">{Your reasoning about moving right}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 5
        print_visualization: false
        print_coordinates: true
        width: 10
        height: 10
        max_rounds: 20
        death_reward: -1
        step_reward: 0


    # --- Config: Snake-20Steps-PoisonAppleAndBanana (Multi-Action) ---
    - name: "Snake-20Steps-PoisonAppleAndBanana-Greedy"
      n_rollouts: 50
      episode_length: 20
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 20000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      epsilon: 0.0
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Game Rules]
        - All apples are poisonous and will hurt you. If you move onto an apple, you *lose* 1 point.
        - All bananas are healthy and are good for you. If you move onto a banana, you *receive* 1 point and you gain a body segment.
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="right">{Your reasoning about moving right}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        num_apples: 3
        num_bananas: 3
        apple_reward: -1
        banana_reward: 1
        width: 10
        height: 10
        print_coordinates: true
        max_rounds: 20
        death_reward: -1
        step_reward: 0
        print_visualization: false


    # --- Config: FastSnake Entropy Probe (Multi-Action) ---
    # Uses inherit_training_multiaction to measure policy entropy with same exploration as training
    - name: "FastSnake-Entropy-Check"
      n_rollouts: 50
      episode_length: 1
      generation:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: false
      initial_seed: 30000
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="right">{Your reasoning about moving right}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 1
        death_reward: -1
        step_reward: 0
        print_visualization: false
      action_entropy:
        enabled: true
        n_samples: 20
        temperature: 1.2
        measure_at_steps: "start"
        step_interval: 1
        exclusive_metric: true
        max_batch_size: 32


    # --- Config: FastSnake StateVisitation (Multi-Action) ---
    # Uses inherit_training_multiaction to measure exploration with same epsilon as training
    - name: "FastSnake-Default-StateVisitation"
      n_rollouts: 300
      batch_size: 50
      episode_length: 8
      generation:
        temperature: 1.25
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        do_sample: true
      initial_seed: 40000
      seed_group_size: 20
      freeze_completed_episodes: true
      duplication_mode: none
      env_name: fastsnake
      task: none
      format_penalty: 0.0
      multi_action_reasoning: true
      inherit_training_multiaction: true
      instruction_prompt: |
        [Instructions]
        You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

        [Game Rules]
        - If you move onto an apple, you get 1 point and you gain a body segment
        - You die if you move into a wall, another snake, or yourself

        [Available Actions]
        "up": move your head one space up,
        "down": move your head one space down,
        "left": move your head one space left,
        "right": move your head one space right,

        [Response Format]
        Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

        <actions>
        <action name="up">{Your reasoning about moving up}</action>
        <action name="down">{Your reasoning about moving down}</action>
        <action name="left">{Your reasoning about moving left}</action>
        <action name="right">{Your reasoning about moving right}</action>
        </actions>
        <decision>{Your selected action from the list above}</decision>
      captioner:
        max_text_history: 0
      fastsnake_kwargs:
        width: 10
        height: 10
        max_rounds: 8
        num_external_snakes: 1
        num_random_snakes: 0
        death_reward: -1
        step_reward: 0
        no_respawn: true
        print_visualization: false
