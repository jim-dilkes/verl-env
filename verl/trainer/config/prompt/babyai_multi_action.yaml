# @package prompt

# BabyAI environment prompt configuration (multi-action reasoning mode)
# To use: prompt=babyai_multi_action

prompt:
  # Multi-action reasoning mode: model generates reasoning for each action
  # When true, uses <decision> tag; when false, uses <action> tag
  multi_action_reasoning: true

  # Epsilon for epsilon-greedy exploration (0 = no random, 1 = always random)
  epsilon: 0.0

  # Adaptive epsilon-greedy (reward-trend-based)
  adaptive_epsilon:
    enabled: false
    epsilon_max: 0.3
    window_size: 50
    k: 5.0
    update_every_n_steps: 1

  # Captioner instruction for NaiveCaptioner (multi-action mode)
  naive_instruction: |


  # Environment instruction for BabyAI (multi-action reasoning mode)
  environment_instruction: |
    [Instructions]
    You are an agent playing a navigation game. Your maximum response length: 300 words.

    [Available Actions]
    "turn left": turn to the left,
    "turn right": turn to the right,
    "go forward": take one step forward,
    "pick up": pick up the object one step in front of you,
    "drop": drop the object that you are holding,
    "toggle": manipulate the object one step in front of you

    [Response Format]
    Reason about EACH action, then make a decision.

    <actions>
    <action name="turn left">Your reasoning...</action>
    <action name="turn right">Your reasoning...</action>
    <action name="go forward">Your reasoning...</action>
    <action name="pick up">Your reasoning...</action>
    <action name="drop">Your reasoning...</action>
    <action name="toggle">Your reasoning...</action>
    </actions>

    <decision>your_chosen_action</decision>

    [Rules]
    - Your goal is to: {mission}
    - You cannot "go forward" if blocked by wall/object
    - Use 'toggle' to interact with objects in front of you

  # DIME (Diverse Instruction-Masked Exploration) config
  dime:
    enabled: false
    source: "specific"        # "specific" (env instructions + template) or "generic" (standalone principles)
    no_supplement_prob: 0.125  # REQUIRED when enabled. Fixed across conditions.
    alpha: 0.5                # teacher/student PG loss weighting: α*L_teacher + (1-α)*L_student
    kl_beta_teacher: 0.0      # coefficient for D_KL(π^T || sg(π^S)) — constrains teacher toward student
    kl_beta_student: 0.0      # coefficient for D_KL(sg(π^T) || π^S) — pulls student toward teacher
    template: 'Pay particular attention to this aspect of the task: "{STEP_TEXT}". Consider how it could apply in the current situation before choosing your action.'
    adaptive:
      enabled: false
      supplement_min: 0.0
      supplement_max: 0.9
      window_size: 30
      k: 15.0
      inflection: 0.05      # sigmoid centre: slope < inflection → high supplement
