# @package prompt

# Overcooked environment prompt configuration (multi-action reasoning mode)
# To use: prompt=overcooked_multi_action
# Model outputs reasoning for each action, then <decision>X</decision>

prompt:
  # Multi-action reasoning mode enabled
  multi_action_reasoning: true

  # Epsilon for epsilon-greedy exploration (0 = no random, 1 = always random)
  epsilon: 0.0

  # Captioner instruction for NaiveCaptioner (multi-action mode)
  naive_instruction: |

  # Environment instruction for Overcooked (multi-action mode)
  environment_instruction: |
    [Instructions]
    You are a chef cooking meals in a kitchen.
    Your goal is to cook and deliver the meals as fast as possible to earn rewards. Your maximum response length: 400 words.

    [Recipe]
    3 onions

    [How to Cook]
    1. Identify the ingredients needed for the meal from the recipe.
    2. Pick up ingredients from ingredient piles using 'interact' while facing them - you can hold only one ingredient at a time
    3. Place 3 ingredients in a pot using 'interact'
    4. Wait for the meal to cook
    5. Pick up a dish from the dish pile using 'interact'
    6. Pick up the cooked meal from the pot using 'interact' (with dish in hand)
    7. Deliver the meal to the serving counter using 'interact'

    [Available Actions]
    "right": move right,
    "down": move down,
    "left": move left,
    "up": move up,
    "stay": stay in place (wait),
    "interact": interact with object in front of you (pick up, place, or use)

    [Response Format]
    You must reason about EACH available action, then make a decision.
    Think about what you need to do next to make and deliver meals.
    Consider your position, what you're facing towards, what you're holding, and pot status.

    First, analyze each action by generating an <action> tag for each:
    <actions>
    <action name="right">Your reasoning about moving right...</action>
    <action name="down">Your reasoning about moving down...</action>
    <action name="left">Your reasoning about moving left...</action>
    <action name="up">Your reasoning about moving up...</action>
    <action name="stay">Your reasoning about staying...</action>
    <action name="interact">Your reasoning about interacting...</action>
    </actions>

    Then, output your final decision:
    <decision>your_chosen_action</decision>
