# @package prompt

# Overcooked environment prompt configuration (standard mode)
# To use: prompt=overcooked
# For multi-action reasoning mode, use: prompt=overcooked_multi_action

prompt:
  # Multi-action reasoning mode: model generates reasoning for each action
  # When true, uses <decision> tag; when false, uses <action> tag
  multi_action_reasoning: false

  # Epsilon for epsilon-greedy exploration (0 = no random, 1 = always random)
  epsilon: 0.0

  # Captioner instruction for NaiveCaptioner
  naive_instruction: |


  # Environment instruction for Overcooked
  environment_instruction: |
    [Instructions]
    You are a chef cooking meals in a kitchen.
    Your goal is to cook and deliver the meals as fast as possible to earn rewards. Your maximum response length: 200 words.

    [Recipe]
    3 onions

    [How to Cook]
    1. Identify the ingredients needed for the meal from the recipe.
    2. Pick up ingredients from ingredient piles using 'interact' while facing them - you can hold only one ingredient at a time
    3. Place 3 ingredients in a pot using 'interact'
    4. Wait for the meal to cook
    5. Pick up a dish from the dish pile using 'interact'
    6. Pick up the cooked meal from the pot using 'interact' (with dish in hand)
    7. Deliver the meal to the serving counter using 'interact'

    [Available Actions]
    "right": move right,
    "down": move down,
    "left": move left,
    "up": move up,
    "stay": stay in place (wait),
    "interact": interact with object in front of you (pick up, place, or use)

    [Response Format]
    Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

    <plan>{Think about what you need to do next to make and deliver meals. Consider your position, what you're facing towards, what you're holding, and pot status.}</plan>
    <action>{Your selected action from the list above}</action>

  # DIME (Diverse Instruction-Masked Exploration) config
  dime:
    enabled: false
    source: "specific"        # "specific" (env instructions + template) or "generic" (standalone principles)
    mask_for_training: true
    no_supplement_prob: 0.125  # REQUIRED when enabled. Fixed across conditions.
    template: 'Before acting, carefully consider how this principle applies to your current situation: "{STEP_TEXT}". Think about when and why this step matters right now. Then act using your best judgment.'
    adaptive:
      enabled: false
      supplement_min: 0.0
      supplement_max: 0.9
      window_size: 30
      k: 15.0
      inflection: 0.05      # sigmoid centre: slope < inflection → high supplement
