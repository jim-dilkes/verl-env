# @package prompt

# Snake/FastSnake prompt configuration (multi-action reasoning mode)
# To use: prompt=snake_multi_action
# Model outputs reasoning for each action, then <decision>X</decision>

prompt:
  # Multi-action reasoning mode enabled
  multi_action_reasoning: true

  # Epsilon for epsilon-greedy exploration (0 = no random, 1 = always random)
  epsilon: 0.0

  # Adaptive epsilon-greedy (reward-trend-based)
  adaptive_epsilon:
    enabled: false
    epsilon_max: 0.3
    window_size: 50
    k: 5.0
    update_every_n_steps: 1

  # Captioner instruction for NaiveCaptioner (multi-action mode)
  naive_instruction: |

  # Environment instruction for FastSnake (multi-action mode)
  environment_instruction: |
    [Instructions]
    You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 300 words.

    [Game Rules]
    - If you move onto an apple, you get 1 point and you gain a body segment
    - You die if you move into a wall, another snake, or yourself

    [Available Actions]
    "up": move your head one space up,
    "down": move your head one space down,
    "left": move your head one space left,
    "right": move your head one space right,

    [Response Format]
    Respond using ONLY valid XML using <actions>...</actions> tags for EACH available action, then output your choice in <decision>...</decision>. Stop responding after the </decision> tag.

    <actions>
    <action name="up">{Your reasoning about moving up}</action>
    <action name="down">{Your reasoning about moving down}</action>
    <action name="left">{Your reasoning about moving left}</action>
    <action name="right">{Your reasoning about moving right}</action>
    </actions>
    <decision>{Your selected action from the list above}</decision>

  # DIME (Diverse Instruction-Masked Exploration) config
  dime:
    enabled: false
    source: "specific"        # "specific" (env instructions + template) or "generic" (standalone principles)
    no_supplement_prob: 0.125  # REQUIRED when enabled. Fixed across conditions.
    alpha: 0.5                # teacher/student PG loss weighting: α*L_teacher + (1-α)*L_student
    kl_beta_teacher: 0.0      # coefficient for D_KL(π^T || sg(π^S)) — constrains teacher toward student
    kl_beta_student: 0.0      # coefficient for D_KL(sg(π^T) || π^S) — pulls student toward teacher
    kl_estimator: k3          # k3 (Schulman per-token) | mean_logprob (paper-faithful per-sample logprob diff)
    kl_filter: none           # KL_S target filter: none | return_positive | top_pct
    kl_filter_top_pct: 0.5    # top_pct mode: fraction of instructed episodes (by return) kept
    assignment: stochastic    # stochastic | deterministic
    n_duplicates: 1           # deterministic: copies of EACH instruction per group
    n_no_instruction: 3       # deterministic: unconditioned samples per group
    eval_unconditioned: false # if true, inline _validate() skips focus injection (measure deployed student)
    template: 'Pay particular attention to this aspect of the task: "{STEP_TEXT}". Consider how it could apply in the current situation before choosing your action.'
    adaptive:
      enabled: false
      supplement_min: 0.0
      supplement_max: 0.9
      window_size: 30
      k: 15.0
      inflection: 0.05      # sigmoid centre: slope < inflection → high supplement
