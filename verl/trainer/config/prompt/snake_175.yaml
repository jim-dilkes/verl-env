# @package prompt

# Example prompt configuration file
# Use this as a template for creating custom prompt configs
# To use this config, specify: prompt=example

prompt:
  # Captioner instruction for NaiveCaptioner
  naive_instruction: |

  
  # Environment instruction for FastSnake
  environment_instruction: |
    [Instructions]
    You are a helpful assistant controlling a snake in a grid-based game. Your maximum response length: 125 words.

    [Game Rules]
    - If you move onto an apple, you get 1 point and you gain a body segment
    - You die if you move into a wall, another snake, or yourself

    [Available Actions]
    "up": move your head one space up,
    "down": move your head one space down,
    "left": move your head one space left,
    "right": move your head one space right,

    [Response Format]
    Respond using ONLY valid XML with <plan>...</plan> and <action>...</action> tags. Stop responding after the </action> tag.

    <plan>{Think about the situation, your goal and your immediate plan to achieve the goal. Describe the exact action you will take next to follow your plan.}</plan>
    <action>{Your selected action from the list above}</action>

  # ICE (Instruction-Conditioned Exploration) config
  ice:
    enabled: false
    source: "generic"        # "specific" (env instructions + template) or "generic" (standalone principles)
    no_supplement_prob: 0.125  # REQUIRED when enabled. Fixed across conditions.
    alpha: 0.5                # teacher/student PG loss weighting: α*L_teacher + (1-α)*L_student
    kl_beta_teacher: 0.0      # coefficient for D_KL(π^T || sg(π^S)) — constrains teacher toward student
    kl_beta_student: 0.0      # coefficient for D_KL(sg(π^T) || π^S) — pulls student toward teacher
    kl_estimator: k3          # k3 (Schulman per-token) | mean_logprob (paper-faithful per-sample logprob diff)
    kl_filter: none           # KL_S target filter: none | return_positive | top_pct
    kl_filter_top_pct: 0.5    # top_pct mode: fraction of instructed episodes (by return) kept
    assignment: stochastic    # stochastic | deterministic
    n_duplicates: 1           # deterministic: copies of EACH instruction per group
    n_no_instruction: 3       # deterministic: unconditioned samples per group
    eval_unconditioned: false # if true, inline _validate() skips focus injection (measure deployed student)
    template: 'Pay particular attention to this aspect of the task: "{STEP_TEXT}". Consider how it could apply in the current situation before choosing your action.'
    adaptive:
      enabled: false
      supplement_min: 0.0
      supplement_max: 0.9
      window_size: 30
      k: 15.0
      inflection: 0.05      # sigmoid centre: slope < inflection → high supplement

